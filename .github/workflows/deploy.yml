name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # The web app is one folder of this repository; the backend and the training
    # code are siblings. Every step below runs inside it.
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      # Vite 8 needs Node 20.19+ or 22.12+; 22 is comfortably inside that.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # Deep links use the hash fragment, so a 404 copy is enough of a fallback.
      - run: cp dist/index.html dist/404.html

      # `path` is resolved from the repository root, not the working directory.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
